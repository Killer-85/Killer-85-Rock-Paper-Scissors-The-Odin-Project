<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Rock Paper Scissors</title>
</head>
<body>

  <div class = "container">
    <h1>Rock Paper Scissors</h1>

    <div class="score-board">
      <h2>ScoreBoard</h2>
      <p>Player: <span id="player-score">0</span></p>
      <p>Computer: <span id="computer-score">0</span> </p>
    </div>

    <div class="choices">
      <button id = "rock" value="Rock">Rock</button>
      <button id = "paper" value = "Paper">Paper</button>
      <button id = "scissors" value = "Scissors">Scissors</button>
    </div>
    
    <div id = "result"></div>
    <div id="final-result"></div>
    
  </div>
  

  <script src="script.js">

  </script>

</body>
</html>
